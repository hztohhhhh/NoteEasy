<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NoteEasy</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --panel-soft: #f9fbff;
      --text: #172033;
      --muted: #667085;
      --line: #d9e0ea;
      --inline-code-bg: #eef2f7;
      --accent: #1b74e4;
      --accent-strong: #0e5fc4;
      --ok: #14875f;
      --warn: #b7791f;
      --danger: #c2413b;
      --shadow: 0 14px 40px rgba(25, 38, 68, 0.12);
      --explorer-width: 280px;
      --outline-width: 280px;
      --mono: "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #16181d;
      --panel: #20242b;
      --panel-soft: #262b33;
      --text: #eef2f7;
      --muted: #a7b0bd;
      --line: #38414e;
      --inline-code-bg: #303743;
      --accent: #58a6ff;
      --accent-strong: #79b8ff;
      --ok: #46c08a;
      --warn: #d7a642;
      --danger: #ff736c;
      --shadow: 0 16px 42px rgba(0, 0, 0, 0.34);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      overflow: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      color: var(--text);
      background: var(--panel);
      min-height: 36px;
      padding: 0 12px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease, transform 0.15s ease;
      white-space: nowrap;
    }

    button:hover {
      border-color: var(--accent);
      color: var(--accent-strong);
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      transform: none;
    }

    .primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    .primary:hover {
      background: var(--accent-strong);
      color: #ffffff;
    }

    .icon-only {
      width: 38px;
      padding: 0;
    }

    .toolbar-select {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 34px 0 10px;
      color: var(--text);
      background: var(--panel);
      outline: 0;
      cursor: pointer;
    }

    .toolbar-select:focus {
      border-color: var(--accent);
    }

    .app {
      height: 100%;
      min-width: 320px;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .toolbar {
      min-height: 58px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(16px);
      position: relative;
      z-index: 3;
    }

    .toolbar-primary {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 0 0 auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #ffffff;
      color: #1b74e4;
      flex: 0 0 auto;
      box-shadow: 0 6px 18px rgba(27, 116, 228, 0.28);
      overflow: hidden;
    }

    .brand-mark img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .file-meta {
      display: none;
      min-width: 0;
    }

    .file-name {
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 34vw;
    }

    .file-detail {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 34vw;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 0;
      flex: 1 1 auto;
    }

    .segmented {
      display: inline-flex;
      padding: 3px;
      gap: 2px;
      border: 1px solid var(--line);
      background: var(--panel-soft);
      border-radius: 8px;
    }

    .segmented button {
      border: 0;
      min-height: 30px;
      padding: 0 10px;
      background: transparent;
      color: var(--muted);
    }

    .segmented button.active {
      background: var(--panel);
      color: var(--accent-strong);
      box-shadow: 0 1px 3px rgba(20, 30, 48, 0.12);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(190px, min(var(--explorer-width), 34vw)) 8px minmax(0, 1fr) 8px minmax(190px, min(var(--outline-width), 34vw));
      min-height: 0;
      position: relative;
    }

    .explorer-collapsed .workspace {
      grid-template-columns: minmax(0, 1fr) 8px minmax(190px, min(var(--outline-width), 34vw));
    }

    .outline-collapsed .workspace {
      grid-template-columns: minmax(190px, min(var(--explorer-width), 34vw)) 8px minmax(0, 1fr);
    }

    .explorer-collapsed.outline-collapsed .workspace {
      grid-template-columns: minmax(0, 1fr);
    }

    .explorer-collapsed .explorer-pane,
    .explorer-collapsed .explorer-resizer,
    .outline-collapsed .outline-pane,
    .outline-collapsed .outline-resizer {
      display: none;
    }

    .app.resizing {
      cursor: col-resize;
      user-select: none;
    }

    .pane {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      background: var(--panel);
    }

    .explorer-pane {
      border-right: 1px solid var(--line);
      grid-template-rows: auto auto 1fr;
    }

    .outline-pane {
      border-left: 1px solid var(--line);
    }

    .explorer-resizer,
    .outline-resizer {
      position: relative;
      z-index: 2;
      cursor: col-resize;
      background: var(--bg);
      border-inline: 1px solid var(--line);
    }

    .explorer-resizer::before,
    .outline-resizer::before {
      content: "";
      position: absolute;
      inset: 0 2px;
      border-radius: 6px;
      background: transparent;
    }

    .explorer-resizer:hover::before,
    .explorer-resizing .explorer-resizer::before,
    .outline-resizer:hover::before,
    .outline-resizing .outline-resizer::before {
      background: var(--accent);
      opacity: 0.38;
    }

    .document-pane {
      min-width: 0;
      grid-template-rows: auto 1fr;
    }

    .pane-head {
      min-height: 46px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--panel-soft);
    }

    .pane-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
    }

    .pane-tools {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .pane-tools button {
      min-height: 28px;
      width: 30px;
      padding: 0;
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
    }

    .pane-tools button.active {
      color: var(--accent-strong);
      background: var(--panel);
      border-color: var(--accent);
    }

    .repository-search {
      display: none;
      padding: 10px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    .explorer-pane.search-visible .repository-search {
      display: block;
    }

    .repository-search input {
      width: 100%;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 10px;
      color: var(--text);
      background: var(--panel-soft);
      outline: 0;
    }

    .repository-search input:focus {
      border-color: var(--accent);
      background: var(--panel);
    }

    .file-tree {
      overflow: auto;
      padding: 8px;
      background: var(--panel);
    }

    .file-tree-empty {
      display: grid;
      place-items: center;
      min-height: 190px;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
      padding: 18px;
    }

    .tree-node {
      margin: 1px 0;
    }

    .tree-row {
      width: 100%;
      min-height: 30px;
      display: grid;
      grid-template-columns: 18px 18px minmax(0, 1fr);
      align-items: center;
      gap: 5px;
      border: 0;
      border-radius: 7px;
      padding: 3px 7px;
      color: var(--text);
      background: transparent;
      text-align: left;
    }

    .tree-row:hover,
    .tree-row.active,
    .tree-row.drop-target {
      background: var(--panel-soft);
      color: var(--accent-strong);
    }

    .tree-row.active {
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .tree-row mark {
      padding: 0;
      background: color-mix(in srgb, var(--warn) 30%, transparent);
      color: inherit;
    }

    .tree-caret {
      color: var(--muted);
      transition: transform 0.16s ease;
    }

    .tree-row.expanded .tree-caret {
      transform: rotate(90deg);
    }

    .tree-row.file .tree-caret {
      opacity: 0;
    }

    .tree-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tree-children {
      margin-left: 14px;
    }

    .tree-node.collapsed > .tree-children {
      display: none;
    }

    .tree-row[draggable="true"] {
      cursor: grab;
    }

    .tabs-bar {
      min-height: 46px;
      display: flex;
      align-items: stretch;
      gap: 1px;
      overflow-x: auto;
      border-bottom: 1px solid var(--line);
      background: var(--panel-soft);
    }

    .note-tab {
      max-width: 220px;
      min-width: 128px;
      min-height: 46px;
      justify-content: flex-start;
      border: 0;
      border-right: 1px solid var(--line);
      border-radius: 0;
      padding: 0 8px 0 10px;
      gap: 6px;
      background: var(--panel-soft);
      color: var(--muted);
    }

    .note-tab.active {
      color: var(--text);
      background: var(--panel);
      box-shadow: inset 0 -2px 0 var(--accent);
    }

    .note-tab.preview-tab .tab-title {
      font-style: italic;
    }

    .note-tab.dirty .tab-title::after {
      content: " *";
      color: var(--accent-strong);
    }

    .tab-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tab-close {
      width: 22px;
      min-height: 22px;
      display: inline-grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      flex: 0 0 auto;
    }

    .document-body,
    .editor-wrap {
      min-height: 0;
      position: relative;
    }

    .source-panel,
    .preview-panel {
      min-height: 0;
      height: 100%;
    }

    .source-mode .preview-panel,
    .preview-mode .source-panel {
      display: none;
    }

    #markdownInput {
      width: 100%;
      height: 100%;
      resize: none;
      border: 0;
      outline: 0;
      padding: 18px;
      color: var(--text);
      background: var(--panel);
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.65;
      tab-size: 2;
    }

    #markdownInput::placeholder {
      color: var(--muted);
    }

    .preview-scroll {
      overflow: auto;
      min-height: 0;
      background: var(--bg);
      padding: 26px;
    }

    .preview-shell {
      width: min(100%, 980px);
      margin: 0 auto;
      background: var(--panel);
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .outline-list {
      overflow: auto;
      padding: 10px;
      background: var(--panel);
    }

    .outline-empty {
      display: grid;
      place-items: center;
      min-height: 180px;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
      padding: 18px;
    }

    .outline-item {
      width: 100%;
      min-height: 34px;
      justify-content: flex-start;
      border: 0;
      border-radius: 7px;
      color: var(--text);
      background: transparent;
      text-align: left;
      white-space: normal;
      line-height: 1.35;
      padding: 7px 9px;
      margin: 1px 0;
    }

    .outline-item:hover {
      background: var(--panel-soft);
    }

    .outline-item.active {
      color: var(--accent-strong);
      background: var(--panel-soft);
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .outline-item.outline-hidden {
      display: none;
    }

    .outline-caret {
      width: 16px;
      height: 16px;
      display: inline-grid;
      place-items: center;
      color: var(--muted);
      transition: transform 0.16s ease;
    }

    .outline-item.expanded .outline-caret {
      transform: rotate(90deg);
    }

    .outline-caret.placeholder {
      opacity: 0;
    }

    .outline-level-1 {
      font-weight: 700;
    }

    .outline-level-2 {
      padding-left: 24px;
      color: var(--text);
    }

    .outline-level-3 {
      padding-left: 42px;
      color: var(--muted);
    }

    .outline-level-4 {
      padding-left: 58px;
      color: var(--muted);
    }

    .outline-number {
      flex: 0 0 auto;
      color: var(--accent-strong);
      font-variant-numeric: tabular-nums;
    }

    .outline-title {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .heading-flash {
      animation: headingFlash 1.4s ease;
    }

    @keyframes headingFlash {
      0%,
      100% {
        background: transparent;
      }
      25%,
      70% {
        background: color-mix(in srgb, var(--accent) 18%, transparent);
      }
    }

    .empty-state {
      min-height: 360px;
      display: grid;
      place-items: center;
      padding: 40px;
      color: var(--muted);
      text-align: center;
    }

    .empty-state svg {
      display: block;
      margin: 0 auto 14px;
      color: var(--accent);
    }

    .statusbar {
      min-height: 34px;
      padding: 6px 14px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--panel);
      color: var(--muted);
      font-size: 12px;
    }

    .status-list {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
    }

    .status-list span {
      flex: 0 0 auto;
    }

    #currentPathText {
      min-width: 0;
      flex: 1 1 auto;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-message {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
    }

    .drop-overlay {
      display: none;
      position: absolute;
      inset: 12px;
      z-index: 8;
      border: 2px dashed var(--accent);
      background: var(--panel);
      backdrop-filter: blur(10px);
      border-radius: 8px;
      place-items: center;
      color: var(--accent-strong);
      font-weight: 700;
      pointer-events: none;
    }

    .app.dragging .drop-overlay {
      display: grid;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 46px;
      max-width: min(440px, calc(100vw - 36px));
      padding: 11px 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
      z-index: 10;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .context-menu {
      position: fixed;
      z-index: 20;
      width: 240px;
      max-width: calc(100vw - 20px);
      max-height: calc(100vh - 20px);
      overflow-y: auto;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      display: none;
    }

    .context-menu.show {
      display: block;
    }

    .context-menu button {
      width: 100%;
      min-height: 34px;
      justify-content: flex-start;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--text);
    }

    .context-menu button:hover {
      background: var(--panel-soft);
    }

    .table-toolbar {
      position: fixed;
      z-index: 22;
      max-width: min(520px, calc(100vw - 20px));
      display: none;
      align-items: center;
      gap: 4px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .table-toolbar.show {
      display: flex;
      flex-wrap: wrap;
    }

    .table-toolbar button {
      min-height: 32px;
      padding: 0 9px;
      border-radius: 7px;
      gap: 6px;
      background: transparent;
      border: 0;
    }

    .table-toolbar button:hover {
      background: var(--panel-soft);
    }

    .table-toolbar button[hidden] {
      display: none;
    }

    .table-edge-add {
      position: fixed;
      z-index: 21;
      width: 28px;
      height: 28px;
      min-height: 28px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid var(--accent);
      background: var(--panel);
      color: var(--accent);
      box-shadow: var(--shadow);
      display: none;
    }

    .table-edge-add.show {
      display: inline-flex;
    }

    .table-resize-handle {
      position: fixed;
      z-index: 19;
      display: none;
      background: rgba(27, 116, 228, 0.28);
    }

    .table-resize-handle.show {
      display: block;
    }

    .table-col-resize {
      width: 6px;
      cursor: col-resize;
    }

    .table-row-resize {
      height: 6px;
      cursor: row-resize;
    }

    body.table-resizing {
      user-select: none;
    }

    body.table-resizing * {
      cursor: inherit !important;
    }

    .context-separator {
      height: 1px;
      margin: 5px 4px;
      background: var(--line);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(15, 23, 42, 0.42);
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width: min(560px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .modal-head,
    .modal-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      background: var(--panel-soft);
      border-bottom: 1px solid var(--line);
    }

    .modal-actions {
      justify-content: flex-end;
      border-top: 1px solid var(--line);
      border-bottom: 0;
    }

    .modal-title {
      font-weight: 700;
    }

    .modal-body {
      padding: 14px;
    }

    .field-label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    #formulaInput {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: 0;
      padding: 10px 12px;
      color: var(--text);
      background: var(--panel);
      font-family: var(--mono);
      line-height: 1.6;
    }

    #formulaInput:focus {
      border-color: var(--accent);
    }

    .modal textarea,
    .modal input[type="text"],
    .modal input[type="url"],
    .modal input[type="number"],
    .modal select {
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: 0;
      color: var(--text);
      background: var(--panel);
    }

    .modal textarea:focus,
    .modal input:focus,
    .modal select:focus {
      border-color: var(--accent);
    }

    .text-grid {
      display: grid;
      gap: 12px;
    }

    .text-field {
      display: grid;
      gap: 8px;
    }

    .text-field input,
    .text-field select {
      width: 100%;
      min-height: 38px;
      padding: 0 10px;
    }

    .text-field textarea {
      width: 100%;
      min-height: 160px;
      resize: vertical;
      padding: 10px 12px;
      font-family: var(--mono);
      line-height: 1.6;
    }

    .number-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .number-field {
      display: grid;
      gap: 8px;
    }

    .number-field input {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: 0;
      padding: 0 10px;
      color: var(--text);
      background: var(--panel);
    }

    .number-field input:focus {
      border-color: var(--accent);
    }

    .field-hint {
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .checkbox-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      color: var(--text);
    }

    @media (max-width: 960px) {
      body {
        overflow: auto;
      }

      .app {
        min-height: 100%;
        height: auto;
      }

      .toolbar {
        align-items: flex-start;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .explorer-collapsed .workspace,
      .outline-collapsed .workspace {
        grid-template-columns: 1fr;
      }

      .explorer-pane,
      .outline-pane {
        border-inline: 0;
        border-bottom: 1px solid var(--line);
        min-height: 220px;
        max-height: 34vh;
      }

      .explorer-resizer,
      .outline-resizer {
        display: none;
      }

      .document-pane {
        min-height: 58vh;
      }

      .file-name,
      .file-detail {
        max-width: 46vw;
      }
    }

    @media (max-width: 680px) {
      .toolbar {
        padding: 10px;
        flex-direction: column;
      }

      .toolbar-primary,
      .brand,
      .toolbar-actions {
        width: 100%;
      }

      .toolbar-primary,
      .toolbar-actions {
        justify-content: flex-start;
        overflow-x: auto;
        padding-bottom: 2px;
      }

      .file-name,
      .file-detail {
        max-width: calc(100vw - 86px);
      }

      .preview-scroll {
        padding: 12px;
      }

      .statusbar {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
  <style id="content-style">
    .markdown-body {
      padding: 42px 52px;
      background: var(--panel, #ffffff);
      color: var(--text, #172033);
      font-family: var(--sans, ui-sans-serif, system-ui, sans-serif);
      font-size: 16px;
      line-height: 1.72;
      overflow-wrap: break-word;
    }

    .markdown-body[contenteditable="true"] {
      outline: 0;
      caret-color: var(--accent, #1b74e4);
    }

    .markdown-body[contenteditable="true"]:focus {
      box-shadow: inset 0 0 0 2px rgba(27, 116, 228, 0.18);
    }

    .markdown-body[data-empty="true"]::before {
      content: "在此输入 Markdown 内容";
      display: block;
      color: var(--muted, #667085);
      pointer-events: none;
    }

    .markdown-body > :first-child {
      margin-top: 0;
    }

    .markdown-body > :last-child {
      margin-bottom: 0;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 {
      line-height: 1.28;
      margin: 1.7em 0 0.65em;
      color: var(--text, #172033);
      font-weight: 780;
    }

    .markdown-body h1 {
      font-size: 2.15em;
      padding-bottom: 0.28em;
      border-bottom: 1px solid var(--line, #d9e0ea);
      text-align: center;
    }

    .markdown-body h2 {
      font-size: 1.55em;
      padding-bottom: 0.22em;
      border-bottom: 1px solid var(--line, #d9e0ea);
    }

    .markdown-body h3 {
      font-size: 1.25em;
    }

    .markdown-body h4 {
      font-size: 1.08em;
    }

    .markdown-body h2[data-outline-number]::before,
    .markdown-body h3[data-outline-number]::before,
    .markdown-body h4[data-outline-number]::before {
      content: attr(data-outline-number) " ";
      color: var(--accent-strong, #0e5fc4);
      font-variant-numeric: tabular-nums;
      user-select: none;
      pointer-events: none;
    }

    .markdown-body p,
    .markdown-body ul,
    .markdown-body ol,
    .markdown-body blockquote,
    .markdown-body table,
    .markdown-body pre,
    .markdown-body .mermaid {
      margin: 0 0 1.05em;
    }

    .markdown-body a {
      color: var(--accent, #1b74e4);
      text-decoration: none;
    }

    .markdown-body a:hover {
      text-decoration: underline;
    }

    .markdown-body mark {
      padding: 0.08em 0.28em;
      border-radius: 5px;
      background: #fff3a3;
      color: #1f2937;
    }

    .markdown-body ul,
    .markdown-body ol {
      padding-left: 1.45em;
    }

    .markdown-body li + li {
      margin-top: 0.28em;
    }

    .markdown-body blockquote {
      padding: 0.1em 1em;
      color: var(--muted, #667085);
      border-left: 4px solid var(--accent, #1b74e4);
      background: var(--panel-soft, #f9fbff);
    }

    .markdown-body hr {
      height: 1px;
      border: 0;
      background: var(--line, #d9e0ea);
      margin: 2em 0;
    }

    .markdown-body img,
    .markdown-body svg {
      max-width: 100%;
      height: auto;
    }

    .markdown-body img {
      display: block;
      margin: 1em auto;
      border-radius: 8px;
    }

    .markdown-body .image-block {
      margin: 1em 0;
      position: relative;
    }

    .markdown-body .image-block img {
      display: inline-block;
      margin: 0;
      max-width: 100%;
      height: auto;
    }

    .markdown-body .image-align-left {
      text-align: left;
    }

    .markdown-body .image-align-center {
      text-align: center;
    }

    .markdown-body .image-align-right {
      text-align: right;
    }

    .node-edit-button {
      position: absolute;
      right: 10px;
      top: 10px;
      z-index: 5;
      min-height: 30px;
      padding: 0 9px;
      border-radius: 7px;
      border: 1px solid var(--line, #d9e0ea);
      background: var(--panel, #ffffff);
      color: var(--text, #172033);
      box-shadow: 0 8px 20px rgba(25, 38, 68, 0.16);
      opacity: 0;
      pointer-events: none;
    }

    .markdown-body .image-block:hover .node-edit-button,
    .markdown-body .mermaid:hover .node-edit-button,
    .markdown-body .math-node:hover .node-edit-button,
    .node-edit-button:focus {
      opacity: 1;
      pointer-events: auto;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      display: block;
      overflow-x: auto;
    }

    .markdown-body th,
    .markdown-body td {
      border: 1px solid var(--line, #d9e0ea);
      padding: 0.55em 0.72em;
      vertical-align: top;
    }

    .markdown-body th {
      background: var(--panel-soft, #f9fbff);
      font-weight: 700;
    }

    .markdown-body td.table-cell-selected,
    .markdown-body th.table-cell-selected {
      background: rgba(27, 116, 228, 0.14);
      box-shadow: inset 0 0 0 2px var(--accent, #1b74e4);
    }

    .markdown-body td.table-cell-active,
    .markdown-body th.table-cell-active {
      box-shadow: inset 0 0 0 2px var(--accent, #1b74e4);
    }

    .markdown-body code {
      font-family: var(--mono, Consolas, monospace);
      font-size: 0.92em;
      padding: 0.15em 0.35em;
      border-radius: 6px;
      background: var(--inline-code-bg, #eef2f7);
    }

    .markdown-body pre {
      position: relative;
      overflow: auto;
      padding: 1em;
      border: 1px solid var(--line, #d9e0ea);
      border-radius: 8px;
      background: #0f172a;
      color: #d6e4ff;
      line-height: 1.62;
    }

    .markdown-body pre code {
      display: block;
      padding: 0;
      background: transparent;
      color: inherit;
      font-size: 0.9em;
    }

    .code-copy {
      position: absolute;
      right: 10px;
      top: 10px;
      min-height: 28px;
      padding: 0 9px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(15, 23, 42, 0.76);
      color: #dbeafe;
      font-size: 12px;
      opacity: 0;
    }

    .markdown-body pre:hover .code-copy,
    .code-copy:focus {
      opacity: 1;
    }

    .markdown-body .mermaid {
      overflow-x: auto;
      padding: 1em;
      border: 1px solid var(--line, #d9e0ea);
      border-radius: 8px;
      background: var(--panel-soft, #f9fbff);
      text-align: center;
      position: relative;
    }

    .markdown-body .math-node,
    .markdown-body .mermaid[contenteditable="false"] {
      cursor: default;
    }

    .markdown-body .math-node {
      position: relative;
    }

    .markdown-body .math-inline {
      display: inline-block;
    }

    .markdown-body .math-node mjx-assistive-mml {
      display: none !important;
    }

    .markdown-body .math-node mjx-container {
      max-width: 100%;
    }

    .markdown-body .math-block {
      display: block;
      overflow-x: auto;
      margin: 1em 0;
      text-align: center;
    }

    .markdown-body .render-error {
      text-align: left;
      color: var(--danger, #c2413b);
      white-space: pre-wrap;
      font-family: var(--mono, Consolas, monospace);
      font-size: 13px;
    }

    .markdown-body mjx-container {
      overflow-x: auto;
      overflow-y: hidden;
      max-width: 100%;
    }

    .markdown-body .task-list-item {
      list-style: none;
    }

    .markdown-body .task-list-item input {
      margin: 0 0.45em 0 -1.25em;
      vertical-align: middle;
    }

    .hljs-comment,
    .hljs-quote {
      color: #8b949e;
      font-style: italic;
    }

    .hljs-keyword,
    .hljs-selector-tag,
    .hljs-subst {
      color: #ff7b72;
    }

    .hljs-number,
    .hljs-literal,
    .hljs-variable,
    .hljs-template-variable,
    .hljs-tag .hljs-attr {
      color: #79c0ff;
    }

    .hljs-string,
    .hljs-doctag {
      color: #a5d6ff;
    }

    .hljs-title,
    .hljs-section,
    .hljs-selector-id {
      color: #d2a8ff;
      font-weight: 700;
    }

    .hljs-type,
    .hljs-class .hljs-title {
      color: #ffa657;
    }

    .hljs-tag,
    .hljs-name,
    .hljs-attribute {
      color: #7ee787;
    }

    .hljs-regexp,
    .hljs-link {
      color: #a5d6ff;
    }

    .hljs-symbol,
    .hljs-bullet {
      color: #f2cc60;
    }

    .hljs-built_in,
    .hljs-builtin-name {
      color: #ffa657;
    }

    .hljs-meta {
      color: #8b949e;
    }

    .hljs-deletion {
      background: rgba(248, 81, 73, 0.18);
    }

    .hljs-addition {
      background: rgba(46, 160, 67, 0.18);
    }

    @media (max-width: 680px) {
      .markdown-body {
        padding: 26px 22px;
        font-size: 15px;
      }

      .markdown-body h1 {
        font-size: 1.7em;
      }

      .markdown-body h2 {
        font-size: 1.35em;
      }
    }

    @media print {
      * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      body {
        background: #ffffff;
      }

      html,
      body {
        width: auto !important;
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
      }

      .toolbar,
      .explorer-pane,
      .explorer-resizer,
      .outline-pane,
      .outline-resizer,
      .tabs-bar,
      .source-panel,
      .pane-head,
      .context-menu,
      .modal-backdrop,
      .statusbar,
      .code-copy,
      .node-edit-button {
        display: none !important;
      }

      .app,
      .workspace,
      .document-pane,
      .document-body,
      .preview-panel,
      .preview-scroll,
      .preview-shell {
        display: block;
        height: auto;
        min-height: 0;
        padding: 0;
        margin: 0;
        overflow: visible;
        border: 0;
        box-shadow: none;
        background: #ffffff;
      }

      .markdown-body {
        color: #111827;
        background: #ffffff;
        padding: 0;
        font-size: 15px;
        line-height: 1.68;
        overflow: visible;
      }

      .markdown-body pre,
      .markdown-body table,
      .markdown-body .mermaid,
      .markdown-body .math-block,
      .markdown-body .image-block {
        break-inside: avoid;
        page-break-inside: avoid;
      }

      .markdown-body pre,
      .markdown-body .mermaid {
        overflow: visible;
      }

      .markdown-body pre code {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .markdown-body .mermaid svg,
      .markdown-body .math-node svg,
      .markdown-body img {
        max-width: 100%;
        height: auto;
      }

      @page {
        size: A4;
        margin: 12mm;
      }
    }
  </style>
</head>
<body>
  <div class="app preview-mode" id="app">
    <header class="toolbar">
      <div class="toolbar-primary">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"><img src="assets/icon.svg" alt=""></div>
          <div class="file-meta">
            <div class="file-name" id="fileName">NoteEasy</div>
            <div class="file-detail" id="fileDetail">未加载文件</div>
          </div>
        </div>
        <input type="file" id="fileInput" accept=".md,.markdown,.mdown,.mkd,.txt,text/markdown,text/plain" hidden>
        <button type="button" class="primary" id="openFile" title="打开 Markdown 文件">
          <i data-lucide="folder-open"></i><span>打开</span>
        </button>
        <button type="button" id="openRepository" title="选择笔记仓库">
          <i data-lucide="folder-tree"></i><span>仓库</span>
        </button>
        <button type="button" id="explorerToggle" title="显示或隐藏文件目录树">
          <i data-lucide="panel-left"></i><span>目录</span>
        </button>
      </div>

      <div class="toolbar-actions">
        <button type="button" id="exportHtml" title="导出 HTML 文件">
          <i data-lucide="file-code-2"></i><span>HTML</span>
        </button>
        <button type="button" id="exportPdf" title="导出 A4 PDF 文件">
          <i data-lucide="file-down"></i><span>PDF</span>
        </button>
        <button type="button" id="exportMd" title="导出 Markdown 文件">
          <i data-lucide="file-text"></i><span>MD</span>
        </button>
        <button type="button" id="outlineToggle" title="显示或隐藏大纲">
          <i data-lucide="list-tree"></i><span>大纲</span>
        </button>
        <select id="numberingMode" class="toolbar-select" title="标题编号方式" aria-label="标题编号方式">
          <option value="mode1">按章节</option>
          <option value="mode2">按大写</option>
          <option value="mode3">自动序号</option>
          <option value="none">不编号</option>
        </select>
        <div class="segmented" role="group" aria-label="编辑模式">
          <button type="button" data-view="preview" class="active" title="预览编辑"><i data-lucide="eye"></i><span>预览</span></button>
          <button type="button" data-view="source" title="源码编辑"><i data-lucide="braces"></i><span>源码</span></button>
        </div>
        <button type="button" class="icon-only" id="themeToggle" title="切换主题">
          <i data-lucide="moon"></i>
        </button>
      </div>
    </header>

    <main class="workspace" id="workspace">
      <aside class="pane explorer-pane" aria-label="文件目录树">
        <div class="pane-head">
          <div class="pane-title"><i data-lucide="folder-tree"></i><span>文件</span></div>
          <div class="pane-tools">
            <button type="button" id="newNoteButton" title="新建笔记"><i data-lucide="file-plus-2"></i></button>
            <button type="button" id="newFolderButton" title="新建文件夹"><i data-lucide="folder-plus"></i></button>
            <button type="button" id="refreshTreeButton" title="刷新目录"><i data-lucide="refresh-cw"></i></button>
            <button type="button" id="treeSearchToggle" title="显示或隐藏搜索"><i data-lucide="search"></i></button>
          </div>
        </div>
        <div class="repository-search">
          <input id="treeSearch" type="search" placeholder="搜索笔记或文件名" autocomplete="off">
        </div>
        <div class="file-tree" id="fileTree">
          <div class="file-tree-empty">请选择一个文件夹作为笔记仓库</div>
        </div>
      </aside>
      <div class="explorer-resizer" id="explorerResizer" role="separator" aria-label="调整文件目录宽度" aria-orientation="vertical"></div>

      <section class="pane document-pane" aria-label="Markdown 文档">
        <div class="tabs-bar" id="tabsBar" aria-label="已打开笔记标签页"></div>
        <div class="document-body">
          <div class="editor-wrap source-panel" id="sourcePanel">
            <textarea id="markdownInput" spellcheck="false" placeholder="在此粘贴 Markdown，或打开 .md 文件"></textarea>
          </div>
          <div class="preview-scroll preview-panel" id="previewScroll">
            <div class="preview-shell">
              <article class="markdown-body" id="preview" contenteditable="true" spellcheck="false">
                <div class="empty-state">
                  <div>
                    <i data-lucide="file-search"></i>
                    <div>未加载 Markdown</div>
                  </div>
                </div>
              </article>
            </div>
          </div>
        </div>
      </section>

      <div class="outline-resizer" id="outlineResizer" role="separator" aria-label="调整大纲宽度" aria-orientation="vertical"></div>
      <aside class="pane outline-pane" aria-label="文档大纲">
        <div class="pane-head">
          <div class="pane-title"><i data-lucide="list-tree"></i><span>大纲</span></div>
          <div class="pane-tools" id="outlineStats">0 项</div>
        </div>
        <div class="outline-list" id="outlineList">
          <div class="outline-empty">暂无一级至四级标题</div>
        </div>
      </aside>
      <div class="drop-overlay">释放文件</div>
    </main>

    <footer class="statusbar">
      <div class="status-list">
        <span id="statusText">就绪</span>
        <span id="currentFileText">未加载文件</span>
        <span id="currentPathText">本地页面</span>
        <span id="sizeText">0 KB</span>
        <span id="statsText">0 标题 · 0 代码块 · 0 图表</span>
        <span id="updatedText">本地页面</span>
      </div>
      <div class="status-message" id="messageText"></div>
    </footer>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-backdrop" id="textPromptDialog" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="textPromptTitle">
      <div class="modal-head">
        <div class="modal-title" id="textPromptTitle">输入名称</div>
        <button type="button" class="icon-only" id="textPromptClose" title="关闭"><i data-lucide="x"></i></button>
      </div>
      <div class="modal-body">
        <label class="text-field" for="textPromptInput">
          <span class="field-label" id="textPromptMessage">名称</span>
          <input type="text" id="textPromptInput" autocomplete="off">
        </label>
      </div>
      <div class="modal-actions">
        <button type="button" id="textPromptCancel">取消</button>
        <button type="button" class="primary" id="textPromptConfirm">确认</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="confirmDialog" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <div class="modal-head">
        <div class="modal-title" id="confirmTitle">确认操作</div>
        <button type="button" class="icon-only" id="confirmClose" title="关闭"><i data-lucide="x"></i></button>
      </div>
      <div class="modal-body">
        <div class="field-hint" id="confirmMessage"></div>
      </div>
      <div class="modal-actions">
        <button type="button" id="confirmCancel">取消</button>
        <button type="button" class="primary" id="confirmOk">确认</button>
      </div>
    </div>
  </div>

  <div class="context-menu" id="fileContextMenu" role="menu" aria-label="文件目录菜单">
    <button type="button" data-file-command="new-note"><i data-lucide="file-plus-2"></i><span>新建笔记</span></button>
    <button type="button" data-file-command="new-folder"><i data-lucide="folder-plus"></i><span>新建文件夹</span></button>
    <div class="context-separator"></div>
    <button type="button" data-file-command="rename"><i data-lucide="pencil"></i><span>重命名</span></button>
    <button type="button" data-file-command="move"><i data-lucide="folder-input"></i><span>移动到目录</span></button>
    <button type="button" data-file-command="delete"><i data-lucide="trash-2"></i><span>删除</span></button>
    <button type="button" data-file-command="show"><i data-lucide="external-link"></i><span>在系统中显示</span></button>
  </div>

  <div class="context-menu" id="contextMenu" role="menu" aria-label="预览编辑菜单">
    <button type="button" data-command="h1"><i data-lucide="heading-1"></i><span>设为一级标题</span></button>
    <button type="button" data-command="h2"><i data-lucide="heading-2"></i><span>设为二级标题</span></button>
    <button type="button" data-command="h3"><i data-lucide="heading-3"></i><span>设为三级标题</span></button>
    <button type="button" data-command="h4"><i data-lucide="heading-4"></i><span>设为四级标题</span></button>
    <button type="button" data-command="paragraph"><i data-lucide="pilcrow"></i><span>设为正文</span></button>
    <div class="context-separator"></div>

      if (!window.markdownit) {
        preview.innerHTML = `<div class="empty-state"><div><i data-lucide="file-warning"></i><div>Markdown 渲染库未加载</div></div></div>`;
        statusText.textContent = '依赖未加载';
        messageText.textContent = '请检查网络或 CDN 访问';

          window.lucide.createIcons({
            attrs: {
              width: 18,
              height: 18,
              'stroke-width': 2
            }
          });
        }
        return;
      }

      const md = window.markdownit({
        html: true,
        linkify: true,
        typographer: true,
        breaks: false,
        highlight(code, language) {
          const lang = language && language.trim();
          if (lang && window.hljs && window.hljs.getLanguage(lang)) {
            try {
              return `<pre><code class="hljs language-${escapeHtml(lang)}">${window.hljs.highlight(code, { language: lang, ignoreIllegals: true }).value}</code></pre>`;
            } catch (error) {
              return `<pre><code class="hljs">${escapeHtml(code)}</code></pre>`;
            }
          }
          if (window.hljs) {
            try {
              return `<pre><code class="hljs">${window.hljs.highlightAuto(code).value}</code></pre>`;
            } catch (error) {
              return `<pre><code class="hljs">${escapeHtml(code)}</code></pre>`;
            }
          }
          return `<pre><code class="hljs">${escapeHtml(code)}</code></pre>`;
        }
      });

      installMathRules(md);

      const defaultFence = md.renderer.rules.fence;
      md.renderer.rules.fence = (tokens, idx, options, env, self) => {
        const token = tokens[idx];
        const info = token.info ? token.info.trim().split(/\s+/)[0].toLowerCase() : '';
        if (['mermaid', 'flowchart', 'sequence'].includes(info)) {
          const fence = `\`\`\`mermaid\n${token.content.trim()}\n\`\`\``;
          return `<div class="mermaid" data-md="${escapeHtml(fence)}" contenteditable="false">${escapeHtml(token.content)}</div>`;
        }
        return defaultFence(tokens, idx, options, env, self);
      };

      md.renderer.rules.checkbox_open = () => '<input type="checkbox" disabled ';

      const turndownService = createTurndownService();
      if (!turndownService) {
        setMessage('Turndown 未加载，预览编辑无法回写源码', true);

      if (window.mermaid) {
        window.mermaid.initialize({
          startOnLoad: false,
          securityLevel: 'loose',

      handleLayoutExportRequest();

        fileTree.addEventListener('dragover', handleFileTreeDragOver);

        fileTree.addEventListener('drop', handleFileTreeDrop);
        fileTree.addEventListener('dragend', clearFileTreeDropTargets);
        tabsBar.addEventListener('click', handleTabClick);
        tabsBar.addEventListener('dblclick', handleTabDoubleClick);

        textPromptClose.addEventListener('click', () => resolveTextPrompt(null));
        textPromptCancel.addEventListener('click', () => resolveTextPrompt(null));
        textPromptConfirm.addEventListener('click', () => resolveTextPrompt(textPromptInput.value.trim()));
        textPromptInput.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') {
            event.preventDefault();
            resolveTextPrompt(textPromptInput.value.trim());
          }
        });
        confirmClose.addEventListener('click', () => resolveConfirm(false));
        confirmCancel.addEventListener('click', () => resolveConfirm(false));
        confirmOk.addEventListener('click', () => resolveConfirm(true));
        fileInput.addEventListener('change', () => {
          const [file] = fileInput.files || [];
          if (file) {
            readMarkdownFile(file);
          }
          fileInput.value = '';
        });

        input.addEventListener('input', () => {
          currentFileName = currentFileName || sampleName;
          fileName.textContent = currentFileName;
          fileDetail.textContent = '正在编辑';
          markActiveTabDirty();
          scheduleRender();
          scheduleAutoSave();
        });
        input.addEventListener('scroll', () => {
          persistActiveTabScroll();
          syncOutlineToSourceScroll();
        });

        exportHtmlButton.addEventListener('click', exportHtml);
        exportPdfButton.addEventListener('click', exportPdf);
        exportMdButton.addEventListener('click', exportMarkdown);
        outlineToggle.addEventListener('click', toggleOutline);
        explorerResizer.addEventListener('pointerdown', startExplorerResize);
        outlineResizer.addEventListener('pointerdown', startOutlineResize);
        numberingModeSelect.addEventListener('change', () => {
          persistNumberingMode(numberingModeSelect.value);
          updateOutlineFromPreview();
        });
        themeToggle.addEventListener('click', toggleTheme);

        viewButtons.forEach((button) => {
          button.addEventListener('click', () => setView(button.dataset.view));
        });

        outlineList.addEventListener('click', (event) => {
          const toggle = event.target.closest('[data-outline-toggle]');
          if (toggle) {
            event.preventDefault();
            toggleOutlineBranch(toggle.dataset.outlineToggle);
            return;
          }
          const button = event.target.closest('[data-outline-id]');
          if (button) {
            jumpToHeading(button.dataset.outlineId);
          }
        });

        preview.addEventListener('input', () => {
          if (isRendering || currentView !== 'preview') return;
          preview.removeAttribute('data-empty');
          markActiveTabDirty({ preservePreview: true });
          schedulePreviewSync();
          scheduleAutoSave();
        });

        preview.addEventListener('contextmenu', (event) => {
          if (currentView !== 'preview' || event.target.closest('.code-copy')) return;
          event.preventDefault();
          contextTarget = event.target;
          const tableCell = getTableCellFromNode(contextTarget);
          if (tableCell) {
            prepareTableContext(tableCell);
            closeContextMenu();
            hideTableEdgeControls();
            openTableToolbar(event.clientX, event.clientY);
          } else {
            clearTableSelection();
            closeTableToolbar();
            hideTableEdgeControls();
            openContextMenu(event.clientX, event.clientY);
          }
          saveSelection();
        });

        document.addEventListener('click', (event) => {
          if (!fileContextMenu.contains(event.target)) {
            closeFileContextMenu();
          }
          if (!contextMenu.contains(event.target)) {
            closeContextMenu();
          }
          if (!tableToolbar.contains(event.target) && !event.target.closest('.table-edge-add') && !getTableCellFromNode(event.target)) {
            closeTableToolbar();
          }
        });

        document.addEventListener('keydown', (event) => {
          if (handleEditorShortcut(event)) {
            return;
          }
          if (event.key === 'Escape') {
            closeFileContextMenu();

      function htmlToMarkdown(root) {
        const clone = root.cloneNode(true);
        const preserved = [];
        const preserveNode = (node, markdown) => {
          const placeholder = `MDVIEWERPRESERVE${preserved.length}END`;
          preserved.push({ placeholder, markdown });
          node.replaceWith(document.createTextNode(placeholder));
        };
        clone.querySelectorAll('.code-copy, .node-edit-button, .empty-state').forEach((node) => node.remove());
        clone.querySelectorAll('[contenteditable]').forEach((node) => node.removeAttribute('contenteditable'));
        clone.querySelectorAll('.math-node').forEach((node) => {
          if (!node.dataset.md && node.dataset.tex) {
            node.dataset.md = node.classList.contains('math-block') ? `$$\n${node.dataset.tex}\n$$` : `$${node.dataset.tex}$`;
          }
          preserveNode(node, node.classList.contains('math-block') ? `\n\n${node.dataset.md}\n\n` : node.dataset.md);
        });
        clone.querySelectorAll('.mermaid[data-md]').forEach((node) => {
          preserveNode(node, `\n\n${node.dataset.md}\n\n`);
        });
        clone.querySelectorAll('.image-block').forEach((node) => {
          preserveNode(node, `\n\n${cleanHtmlBlock(node)}\n\n`);
        });
        clone.querySelectorAll('table').forEach((node) => {
          const markdownTable = tableToMarkdown(node);
          preserveNode(node, markdownTable ? `\n\n${markdownTable}\n\n` : `\n\n${cleanHtmlBlock(node)}\n\n`);
        });
        let markdown = turndownService.turndown(clone);
        preserved.forEach((item) => {
          markdown = markdown.split(item.placeholder).join(item.markdown);
        });
        markdown = markdown.replace(/\n{3,}/g, '\n\n').trim();
        return markdown ? `${markdown}\n` : '';
      }

      function tableToMarkdown(table) {
        const rows = Array.from(table.rows || []);
        if (!rows.length) return '';

        const cells = Array.from(table.querySelectorAll('th,td'));
        if (!cells.length) return '';
        if (cells.some((cell) => cell.colSpan > 1 || cell.rowSpan > 1)) return '';

        const columnCount = Math.max(...rows.map((row) => row.cells.length));
        if (!columnCount) return '';

        const firstRow = rows[0];
        const headerRow = table.tHead && table.tHead.rows.length
          ? table.tHead.rows[0]
          : (Array.from(firstRow.cells).some((cell) => cell.tagName.toLowerCase() === 'th') ? firstRow : null);
        if (!headerRow) return '';

        const headerCells = normalizeMarkdownTableRow(headerRow, columnCount);
        const separators = Array.from({ length: columnCount }, (_, index) => getMarkdownTableSeparator(headerRow.cells[index]));
        const bodyRows = rows.filter((row) => row !== headerRow).map((row) => normalizeMarkdownTableRow(row, columnCount));

        return [
          formatMarkdownTableRow(headerCells),
          formatMarkdownTableRow(separators),
          ...bodyRows.map(formatMarkdownTableRow)
        ].join('\n');
      }

      function normalizeMarkdownTableRow(row, columnCount) {
        const cells = Array.from(row.cells).map((cell) => markdownTableCellContent(cell));
        while (cells.length < columnCount) {
          cells.push('');
        }
        return cells.slice(0, columnCount);
      }

      function markdownTableCellContent(cell) {
        if (!cell) return '';
        const wrapper = document.createElement('div');
        wrapper.innerHTML = cell.innerHTML;
        wrapper.querySelectorAll('[contenteditable], [data-outline-id], [data-outline-number]').forEach((node) => {
          node.removeAttribute('contenteditable');
          node.removeAttribute('data-outline-id');
          node.removeAttribute('data-outline-number');
        });
        wrapper.querySelectorAll('.code-copy, .node-edit-button').forEach((node) => node.remove());
        cleanTableEditingState(wrapper);

        const markdown = turndownService.turndown(wrapper).trim()
          .replace(/\r\n/g, '\n')
          .replace(/[ \t]*\n+[ \t]*/g, '<br>');
        return escapeMarkdownTablePipes(markdown);
      }

      function escapeMarkdownTablePipes(text) {
        return String(text || '').replace(/\\*\|/g, (match) => {
          const slashCount = match.length - 1;
          return slashCount % 2 === 1 ? match : `${'\\'.repeat(slashCount)}\\|`;
        });
      }

      function getMarkdownTableSeparator(cell) {
        if (!cell) return '---';
        const align = (cell.getAttribute('align') || cell.style.textAlign || '').trim().toLowerCase();
        if (align === 'center') return ':---:';
        if (align === 'right' || align === 'end') return '---:';
        if (align === 'left' || align === 'start') return ':---';
        return '---';
      }

      function formatMarkdownTableRow(cells) {
        return `| ${cells.join(' | ')} |`;
      }

      function cleanHtmlBlock(node) {
        const clone = node.cloneNode(true);
        clone.querySelectorAll('[contenteditable], [data-outline-id], [data-outline-number]').forEach((item) => {
          item.removeAttribute('contenteditable');
          item.removeAttribute('data-outline-id');
          item.removeAttribute('data-outline-number');
        });
        clone.querySelectorAll('.code-copy, .node-edit-button').forEach((item) => item.remove());
        cleanTableEditingState(clone);
        return clone.outerHTML;
      }

      function cleanTableEditingState(root) {
        root.querySelectorAll('.table-cell-selected, .table-cell-active').forEach((cell) => {
          cell.classList.remove('table-cell-selected', 'table-cell-active');

      async function handleLayoutExportRequest() {
        const params = new URLSearchParams(window.location.search);
        if (!params.has('layoutExport')) return;
        document.documentElement.dataset.layoutExport = 'loading';
        window.__MARKDOWN_LAYOUT_EXPORT_READY__ = false;

        try {
          const payload = await readLayoutExportPayload(params);
          if (payload && typeof payload.content === 'string') {
            const content = stripNumberingMarker(payload.content);
            detectNumberingMode(payload.content);
            currentFileName = payload.name || sampleName;
            input.value = content;
            fileName.textContent = currentFileName;
            fileDetail.textContent = 'PDF 布局导出';
            sizeText.textContent = formatBytes(new Blob([content]).size);
            updatedText.textContent = '已加载';
          }

          await renderMarkdown();
          await waitForPreviewAssets();
          await waitForLayoutStability();
          document.documentElement.dataset.layoutExport = 'ready';
          window.__MARKDOWN_LAYOUT_EXPORT_READY__ = true;
          setMessage('PDF 布局导出就绪');
        } catch (error) {
          document.documentElement.dataset.layoutExport = 'error';
          window.__MARKDOWN_LAYOUT_EXPORT_ERROR__ = error.message || String(error);
          setMessage(`PDF 布局导出准备失败：${window.__MARKDOWN_LAYOUT_EXPORT_ERROR__}`, true);
        }
      }

      async function readLayoutExportPayload(params) {
        const sourceScript = params.get('sourceScript');
        if (sourceScript) {
          await loadLayoutExportScript(sourceScript);
          return window.__MARKDOWN_EXPORT_SOURCE__ || null;
        }

        const sourceUrl = params.get('md');
        if (sourceUrl) {
          const response = await fetch(sourceUrl, { cache: 'no-store' });
          const content = await response.text();
          return {
            name: decodeURIComponent(sourceUrl.split(/[\\/]/).pop() || sampleName),
            content
          };
        }

        const encoded = params.get('md64');
        if (encoded) {
          return {
            name: params.get('name') || sampleName,
            content: decodeBase64Utf8(encoded)
          };
        }

        return null;
      }

      function loadLayoutExportScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = src;
          script.onload = resolve;
          script.onerror = () => reject(new Error(`无法加载导出数据脚本：${src}`));
          document.head.appendChild(script);
        });
      }

      function decodeBase64Utf8(value) {
        const binary = atob(value);
        const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
        return new TextDecoder().decode(bytes);
      }

      function waitForLayoutStability() {
        return new Promise((resolve) => {
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              window.setTimeout(resolve, 250);
            });
          });
        });
      }

      function startPaneResize(event, pane) {
        event.preventDefault();
        const resizer = pane === 'explorer' ? explorerResizer : outlineResizer;
        resizer.setPointerCapture(event.pointerId);
        app.classList.add('resizing', `${pane}-resizing`);
        const onMove = (moveEvent) => {
          const rect = document.getElementById('workspace').getBoundingClientRect();
          const min = 190;
          const max = Math.max(min, rect.width * 0.34);
          const width = pane === 'explorer'
            ? Math.min(max, Math.max(min, moveEvent.clientX - rect.left))
            : Math.min(max, Math.max(min, rect.right - moveEvent.clientX));
          document.documentElement.style.setProperty(`--${pane}-width`, `${width}px`);
        };
        const onUp = () => {
          app.classList.remove('resizing', `${pane}-resizing`);
          const storageKey = pane === 'explorer' ? 'noteeasy-explorer-width' : 'markdown-viewer-outline-width';
          localStorage.setItem(storageKey, getComputedStyle(document.documentElement).getPropertyValue(`--${pane}-width`).trim());
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
        };
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp, { once: true });
      }

      function renderFileTree() {
        if (!treeRoot) {
          fileTree.innerHTML = '<div class="file-tree-empty">请选择一个文件夹作为笔记仓库</div>';
          return;
        }
        const query = treeSearch.value.trim().toLowerCase();
        const html = renderTreeNode(treeRoot, query, true);
        fileTree.innerHTML = html || '<div class="file-tree-empty">没有匹配的 Markdown 笔记</div>';
        createIcons();

      function renderTreeNode(node, query, forceVisible = false) {
        if (!node) return '';
        const ownMatch = matchesTreeQuery(node, query);
        const childHtml = (node.children || [])
          .map((child) => renderTreeNode(child, query, ownMatch))
          .filter(Boolean)
          .join('');
        if (query && !ownMatch && !childHtml && !forceVisible) return '';

        const isFolder = node.type === 'folder';
        const expanded = isFolder && (query || expandedFolders.has(node.path) || node.path === rootPath);
        const active = node.path === currentFilePath;
        const classes = [
          'tree-node',
          isFolder ? 'folder' : 'file',
          expanded ? 'expanded' : 'collapsed'
        ].join(' ');
        const rowClasses = [
          'tree-row',
          isFolder ? 'folder' : 'file',
          expanded ? 'expanded' : '',
          active ? 'active' : ''
        ].filter(Boolean).join(' ');
        const icon = isFolder ? 'folder' : 'file-text';
        const label = query ? highlightMatch(node.name, query) : escapeHtml(node.name);
        return `
          <div class="${classes}" data-node-path="${escapeHtml(node.path)}">
            <button type="button" class="${rowClasses}" data-path="${escapeHtml(node.path)}" data-type="${node.type}" draggable="true" title="${escapeHtml(node.path)}">
              <i class="tree-caret" data-lucide="chevron-right"></i>
              <i data-lucide="${icon}"></i>
              <span class="tree-name">${label}</span>
            </button>
            ${isFolder ? `<div class="tree-children">${childHtml}</div>` : ''}
          </div>
        `;
      }

      function matchesTreeQuery(node, query) {
        if (!query) return true;
        return node.name.toLowerCase().includes(query) || String(node.path || '').toLowerCase().includes(query);
      }

      function highlightMatch(text, query) {
        const value = String(text || '');
        const index = value.toLowerCase().indexOf(query);
        if (!query || index < 0) return escapeHtml(value);
        return `${escapeHtml(value.slice(0, index))}<mark>${escapeHtml(value.slice(index, index + query.length))}</mark>${escapeHtml(value.slice(index + query.length))}`;
      }

      }

      function handleFileTreeDragOver(event) {
        const row = event.target.closest('.tree-row[data-type="folder"]');
        if (!row) return;
        event.preventDefault();
        event.stopPropagation();
        row.classList.add('drop-target');
      }

      function handleFileTreeDragLeave(event) {
        const row = event.target.closest('.tree-row');
        if (row) row.classList.remove('drop-target');
      }

      async function handleFileTreeDrop(event) {
        const row = event.target.closest('.tree-row[data-type="folder"]');
        if (!row || !noteEasyApi) return;
        event.preventDefault();
        event.stopPropagation();
        const sourcePath = event.dataTransfer.getData('text/plain');
        const targetDir = row.dataset.path;
        clearFileTreeDropTargets();
        if (!sourcePath || sourcePath === targetDir) return;
        try {
          const result = await noteEasyApi.moveItem(sourcePath, targetDir, rootPath);
          await refreshFileTree();
          updateTabsAfterRename(result.oldPath || sourcePath, result.path, getBaseName(result.path));
          showToast('已移动');
        } catch (error) {
          showToast(error.message || '移动失败');
        }
      }

      function clearFileTreeDropTargets() {
        fileTree.querySelectorAll('.drop-target').forEach((row) => row.classList.remove('drop-target'));
      }

      function toggleFolder(path) {
        if (expandedFolders.has(path)) {
          expandedFolders.delete(path);
        } else {
          expandedFolders.add(path);
        }
        renderFileTree();
      }

      function openFileContextMenu(x, y) {
        fileContextMenu.classList.add('show');
        fileContextMenu.style.left = `${x}px`;
        fileContextMenu.style.top = `${y}px`;
        const rect = fileContextMenu.getBoundingClientRect();
        fileContextMenu.style.left = `${Math.max(10, Math.min(x, window.innerWidth - rect.width - 10))}px`;
        fileContextMenu.style.top = `${Math.max(10, Math.min(y, window.innerHeight - rect.height - 10))}px`;
        createIcons();
      }

      function closeFileContextMenu() {
        fileContextMenu.classList.remove('show');
      }

      function showTextPrompt({ title, message, value = '' }) {
        return new Promise((resolve) => {
          textPromptResolver = resolve;
          textPromptTitle.textContent = title || '输入内容';
          textPromptMessage.textContent = message || '内容';
          textPromptInput.value = value;
          textPromptDialog.classList.add('show');
          textPromptDialog.setAttribute('aria-hidden', 'false');
          requestAnimationFrame(() => {
            textPromptInput.focus();
            textPromptInput.select();
          });
          createIcons();
        });
      }

      function resolveTextPrompt(value) {
        if (!textPromptResolver) return;
        const resolver = textPromptResolver;
        textPromptResolver = null;
        textPromptDialog.classList.remove('show');
        textPromptDialog.setAttribute('aria-hidden', 'true');
        resolver(value);
      }

      function showConfirmDialog({ title, message }) {
        return new Promise((resolve) => {
          confirmResolver = resolve;
          confirmTitle.textContent = title || '确认操作';
          confirmMessage.textContent = message || '';
          confirmDialog.classList.add('show');
          confirmDialog.setAttribute('aria-hidden', 'false');
          requestAnimationFrame(() => confirmOk.focus());
          createIcons();
        });
      }

      function resolveConfirm(value) {
        if (!confirmResolver) return;
        const resolver = confirmResolver;
        confirmResolver = null;
        confirmDialog.classList.remove('show');
        confirmDialog.setAttribute('aria-hidden', 'true');
        resolver(Boolean(value));
      }

      async function handleFileContextCommand(event) {
        const button = event.target.closest('[data-file-command]');
        if (!button) return;
        event.preventDefault();
        const command = button.dataset.fileCommand;
        closeFileContextMenu();
        if (command === 'new-note') return createItemFromSelection('note');
        if (command === 'new-folder') return createItemFromSelection('folder');
        if (command === 'rename') return renameSelectedItem();
        if (command === 'delete') return deleteSelectedItem();
        if (command === 'move') return moveSelectedItem();
        if (command === 'show' && noteEasyApi && activeFileContextPath) return noteEasyApi.showItem(activeFileContextPath);
      }

      async function createItemFromSelection(type) {
        if (!noteEasyApi || !rootPath) {
          await chooseRepository();
          if (!rootPath) return;
        }
        const parentDir = getTargetDirectory(activeFileContextPath) || rootPath;
        const name = await showTextPrompt({
          title: type === 'note' ? '新建笔记' : '新建文件夹',
          message: type === 'note' ? '笔记名称' : '文件夹名称',
          value: type === 'note' ? '未命名笔记.md' : '新文件夹'
        });
        if (!name) return;
        try {
          const result = type === 'note'
            ? await noteEasyApi.createNote(parentDir, name, rootPath)
            : await noteEasyApi.createFolder(parentDir, name, rootPath);
          expandedFolders.add(parentDir);
          await refreshFileTree();
          if (type === 'note') {
            await openNoteByPath(result.path, { pin: true, preview: false });
          }
          showToast(type === 'note' ? '笔记已创建' : '文件夹已创建');
        } catch (error) {
          showToast(error.message || '创建失败');
        }
      }

      async function renameSelectedItem() {
        if (!noteEasyApi || !activeFileContextPath) return;
        const node = findTreeNode(activeFileContextPath);
        const nextName = await showTextPrompt({
          title: '重命名',
          message: '新名称',
          value: node ? node.name : ''
        });
        if (!nextName) return;
        try {
          const result = await noteEasyApi.renameItem(activeFileContextPath, nextName, rootPath);
          updateTabsAfterRename(result.oldPath, result.path, result.name);
          activeFileContextPath = result.path;
          await refreshFileTree();
          showToast('已重命名');
        } catch (error) {
          showToast(error.message || '重命名失败');
        }
      }

      async function deleteSelectedItem() {
        if (!noteEasyApi || !activeFileContextPath) return;
        const node = findTreeNode(activeFileContextPath);
        const label = node ? node.name : activeFileContextPath;
        const confirmed = await showConfirmDialog({
          title: '删除确认',
          message: `确认删除“${label}”？此操作会从文件系统中删除该项目。`
        });
        if (!confirmed) return;
        try {
          await noteEasyApi.deleteItem(activeFileContextPath, rootPath);
          await closeTabsUnderPath(activeFileContextPath);
          await refreshFileTree();
          showToast('已删除');
        } catch (error) {
          showToast(error.message || '删除失败');
        }
      }

      async function moveSelectedItem() {
        if (!noteEasyApi || !activeFileContextPath) return;
        const target = await showTextPrompt({
          title: '移动项目',
          message: '目标目录路径。可填仓库内相对路径，留空表示仓库根目录。',
          value: ''
        });
        if (target === null) return;
        try {
          const result = await noteEasyApi.moveItem(activeFileContextPath, target, rootPath);
          updateTabsAfterRename(result.oldPath, result.path, getBaseName(result.path));
          activeFileContextPath = result.path;
          await refreshFileTree();
          showToast('已移动');
        } catch (error) {
          showToast(error.message || '移动失败');
        }
      }

      function getTargetDirectory(path) {
        if (!path) return rootPath;
        const found = findNodeAndParent(path);
        if (!found) return rootPath;
        return found.node.type === 'folder' ? found.node.path : (found.parent ? found.parent.path : rootPath);
      }

      function findTreeNode(path) {
        const found = findNodeAndParent(path);
        return found ? found.node : null;
      }

      function findNodeAndParent(path, node = treeRoot, parent = null) {
        if (!node) return null;
        if (node.path === path) return { node, parent };
        for (const child of node.children || []) {
          const found = findNodeAndParent(path, child, node);
          if (found) return found;
        }
        return null;
      }

      function getBaseName(path) {
        return String(path || '').split(/[\\/]/).filter(Boolean).pop() || '';
      }

      async function openNoteByPath(path, options = {}) {
        if (!noteEasyApi || !path) return;
        try {
          await flushPreviewEdits();
          if (getActiveTab() && getActiveTab().dirty && currentFilePath) {
            await saveCurrentFile({ silent: true });
          }
          captureActiveTabState();
          const existing = tabs.find((tab) => tab.path === path);
          if (existing) {
            activeTabId = existing.id;
            if (options.pin) existing.pinned = true;
            await applyActiveTabToEditor(options.position);
            renderTabs();
            renderFileTree();
            return;
          }

          const note = await noteEasyApi.readNote(path, rootPath);
          if (!note || note.missing) {
            if (noteEasyApi && (!note || note.missing)) {
              noteEasyApi.setSettings({ lastFilePath: '', lastPosition: null }).catch(() => {});
            }
            if (!options.silentMissing) {
              showToast('文件不存在，已从最近打开中移除');
            }
            renderFileTree();
            return;
          }
          const noteNumberingMode = detectNumberingMode(note.content);
          const noteContent = stripNumberingMarker(note.content);
          const replacement = options.preview
            ? tabs.find((tab) => !tab.pinned && !tab.dirty)
            : null;
          const tab = replacement || {
            id: `tab-${Date.now()}-${Math.random().toString(16).slice(2)}`,
            previewScrollTop: 0,
            sourceScrollTop: 0
          };
          Object.assign(tab, {
            path: note.path,
            name: note.name,
            content: noteContent,
            numberingMode: noteNumberingMode || numberingModeSelect.value,
            dirty: false,
            pinned: Boolean(options.pin),
            preview: !options.pin,
            size: note.size,
            modifiedAt: note.modifiedAt
          });
          if (!replacement) tabs.push(tab);
          activeTabId = tab.id;
          await applyActiveTabToEditor(options.position);
          renderTabs();
          renderFileTree();
        } catch (error) {
          showToast(error.message || '打开笔记失败');
        }
      }

      async function applyActiveTabToEditor(position = null) {
        const tab = getActiveTab();
        if (!tab) {
          currentFilePath = '';
          currentFileName = '';
          input.value = '';
          fileName.textContent = 'NoteEasy';
          fileDetail.textContent = rootPath || '未加载文件';
          renderTabs();
          await renderMarkdown();
          return;
        }
        currentFilePath = tab.path || '';
        currentFileName = tab.name || sampleName;
        input.value = stripNumberingMarker(tab.content || '');
        if (isValidNumberingMode(tab.numberingMode)) {
          applyNumberingMode(tab.numberingMode);
        } else {
          tab.numberingMode = detectNumberingMode(tab.content) || numberingModeSelect.value;
        }
        fileName.textContent = currentFileName;
        fileDetail.textContent = tab.path || '浏览器文件';
        sizeText.textContent = formatBytes(new Blob([input.value]).size);
        updatedText.textContent = tab.modifiedAt ? formatTime(new Date(tab.modifiedAt)) : '已加载';
        renderTabs();
        if (currentView === 'source') {
          updateSourceStats(input.value);
          updateOutlineFromSource();
        } else if (!restoreCachedPreview(tab)) {
          await renderMarkdown();
        }
        requestAnimationFrame(() => {
          previewScroll.scrollTop = position && Number.isFinite(position.previewTop) ? position.previewTop : (tab.previewScrollTop || 0);
          input.scrollTop = position && Number.isFinite(position.sourceTop) ? position.sourceTop : (tab.sourceScrollTop || 0);
          if (currentView === 'source') {
            syncOutlineToSourceScroll();
          } else {
            syncOutlineToScroll();
          }
        });
        persistActiveTabState();
      }

      function restoreCachedPreview(tab) {
        if (!tab || !tab.previewHtml || tab.renderedSource !== input.value) {
          return false;
        }
        isRendering = true;
        clearTableSelection();
        closeTableToolbar();
        hideTableEdgeControls();
        hideTableResizeHandles();
        preview.innerHTML = tab.previewHtml;
        preview.removeAttribute('data-empty');
        preview.setAttribute('contenteditable', 'true');
        assignHeadingIds();
        updateOutlineFromPreview();
        updateRenderStats();
        statusText.textContent = '就绪';
        setMessage('');
        isRendering = false;
        createIcons();
        return true;
      }

      function updateOutlineFromSource() {
        const state = createNumberingState();
        const items = collectSourceHeadings().map((heading, index) => ({
          id: `source-heading-${index + 1}`,
          level: heading.level,
          number: nextHeadingNumber(heading.level, state),
          title: heading.title || '未命名标题',
          line: heading.line
        }));
        updateOutline(items);
      }

      function getActiveTab() {
        return tabs.find((tab) => tab.id === activeTabId) || null;
      }

      function captureActiveTabState() {
        const tab = getActiveTab();
        if (!tab) return;
        tab.content = input.value;
        tab.numberingMode = numberingModeSelect.value;
        tab.previewScrollTop = previewScroll ? previewScroll.scrollTop : 0;
        tab.sourceScrollTop = input ? input.scrollTop : 0;
        if (currentView === 'preview' && !isRendering) {
          tab.previewHtml = preview.innerHTML;
          tab.renderedSource = input.value;
        }
      }

      function persistActiveTabScroll() {
        captureActiveTabState();
        persistActiveTabState();
      }

      function persistActiveTabState() {
        if (!noteEasyApi || !currentFilePath) return;
        const tab = getActiveTab();
        const lastPosition = {
          filePath: currentFilePath,
          previewTop: tab ? tab.previewScrollTop || 0 : 0,
          sourceTop: tab ? tab.sourceScrollTop || 0 : 0,
          view: currentView
        };
        window.clearTimeout(persistActiveTabState.timer);
        persistActiveTabState.timer = window.setTimeout(() => {
          noteEasyApi.setSettings({ lastFilePath: currentFilePath, lastPosition }).catch(() => {});
        }, 500);
      }

      function renderTabs() {
        if (!tabs.length) {
          tabsBar.innerHTML = '';
          return;
        }
        tabsBar.innerHTML = tabs.map((tab) => {
          const active = tab.id === activeTabId;
          const classes = ['note-tab', active ? 'active' : '', tab.dirty ? 'dirty' : '', !tab.pinned ? 'preview-tab' : '']
            .filter(Boolean)
            .join(' ');
          const pinIcon = tab.pinned ? 'pin' : 'circle';
          return `
            <button type="button" class="${classes}" data-tab-id="${escapeHtml(tab.id)}" title="${escapeHtml(tab.path || tab.name)}">
              <i data-lucide="${pinIcon}"></i>
              <span class="tab-title">${escapeHtml(tab.name || sampleName)}</span>
              <span class="tab-close" data-close-tab="${escapeHtml(tab.id)}" title="关闭">×</span>
            </button>
          `;
        }).join('');
        createIcons();
      }

      async function handleTabClick(event) {
        const close = event.target.closest('[data-close-tab]');
        if (close) {
          event.preventDefault();
          await closeTab(close.dataset.closeTab);
          return;
        }
        const tabButton = event.target.closest('[data-tab-id]');
        if (!tabButton) return;
        await activateTab(tabButton.dataset.tabId);
      }

      function handleTabDoubleClick(event) {
        const tabButton = event.target.closest('[data-tab-id]');
        if (!tabButton) return;
        const tab = tabs.find((item) => item.id === tabButton.dataset.tabId);
        if (tab) {
          tab.pinned = true;
          tab.preview = false;
          renderTabs();
        }
      }

      async function activateTab(tabId) {
        if (activeTabId === tabId) return;
        await flushPreviewEdits();
        if (getActiveTab() && getActiveTab().dirty && currentFilePath) {
          await saveCurrentFile({ silent: true });
        }
        captureActiveTabState();
        activeTabId = tabId;
        await applyActiveTabToEditor();
        renderFileTree();
      }

      async function closeTab(tabId) {
        const tab = tabs.find((item) => item.id === tabId);
        if (!tab) return;
        if (tab.dirty) {
          const confirmed = await showConfirmDialog({
            title: '关闭标签',
            message: `“${tab.name}”有未保存内容，确认关闭？`
          });
          if (!confirmed) return;
        }
        const index = tabs.findIndex((item) => item.id === tabId);
        tabs.splice(index, 1);
        if (activeTabId === tabId) {
          activeTabId = tabs[Math.max(0, index - 1)] ? tabs[Math.max(0, index - 1)].id : '';
          await applyActiveTabToEditor();
        }
        renderTabs();
        renderFileTree();
      }

      function markActiveTabDirty(options = {}) {
        const tab = getActiveTab();
        if (!tab) return;
        if (!tab.pinned) {
